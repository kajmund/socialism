# Required check name for branch protection / rulesets: "CI"
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWE_TAG: v0.1.0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      word_addin: ${{ steps.filter.outputs.word_addin }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      swe_gym: ${{ steps.filter.outputs.swe_gym }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select required test areas
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Fail closed: a swallowed diff error would otherwise report every
          # area false and let the aggregate job pass with nothing tested.
          set -euo pipefail
          backend=false
          frontend=false
          word_addin=false
          knowledge=false
          swe_gym=false
          base_rev="${BASE_SHA:-}"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            backend=true
            frontend=true
            word_addin=true
            knowledge=true
            swe_gym=true
          else
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "A pull_request event must provide base and head SHAs" >&2
              exit 1
            fi
            # Judge the PR against its merge base, not a base-branch tip that may
            # have moved since it branched. `--no-renames` keeps a move visible as
            # a deletion plus an addition.
            base_rev=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            if ! changed=$(git diff --name-only --no-renames "$base_rev" "$HEAD_SHA"); then
              echo "git diff failed for $base_rev..$HEAD_SHA; refusing to judge an unknown diff" >&2
              exit 1
            fi
            if [ -z "$changed" ]; then
              echo "The pull request changes no files; refusing to judge an empty diff" >&2
              exit 1
            fi
            while IFS= read -r path; do
              case "$path" in
                crates/swe-gym/*)
                  swe_gym=true
                  ;;
                .github/workflows/*)
                  # Workflow changes exercise every job they can affect.
                  backend=true
                  frontend=true
                  word_addin=true
                  knowledge=true
                  swe_gym=true
                  ;;
                backend/pyproject.toml|backend/uv.lock|crates/swe-gym/Cargo.toml|crates/swe-gym/Cargo.lock)
                  # The SWE revision is pinned independently in Python and Rust.
                  backend=true
                  swe_gym=true
                  ;;
                backend/*|integrations/*|data/*|crates/*)
                  backend=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
                word-addin/*)
                  word_addin=true
                  ;;
                knowledge/*|okf.project.yaml|Makefile)
                  knowledge=true
                  ;;
                docs/*|features/*|inspiration/*|README.md|AGENTS.md)
                  # Reference material and project instructions do not affect a test target.
                  ;;
                *)
                  # New or shared areas are safety-sensitive until classified here.
                  backend=true
                  frontend=true
                  word_addin=true
                  knowledge=true
                  ;;
              esac
            done <<< "$changed"
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "word_addin=$word_addin"
            echo "knowledge=$knowledge"
            echo "swe_gym=$swe_gym"
          } >> "$GITHUB_OUTPUT"

  swe-gym:
    name: Swe-gym tests
    needs: changes
    if: needs.changes.outputs.swe_gym == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/swe-gym
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/swe-gym
      - name: Format check
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked

  backend:
    name: Backend tests (${{ matrix.group }}/4)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned SWE source
        uses: actions/checkout@v5
        with:
          repository: kajmund/swe
          ref: ${{ env.SWE_TAG }}
          path: .swe-source
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../.swe-source/crates/swe-native/Cargo.toml
      - name: Maintainability
        run: |
          uv run ruff check app tests scripts/check_maintainability.py
          uv run python scripts/check_maintainability.py
      - name: Run pytest
        run: >-
          uv run pytest
          -m "not smoke and not research_reuse and not swe_runtime"
          --splits 4
          --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  research-reuse:
    name: Research reuse contracts (steps 1–4)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned SWE source
        uses: actions/checkout@v5
        with:
          repository: kajmund/swe
          ref: ${{ env.SWE_TAG }}
          path: .swe-source
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../.swe-source/crates/swe-native/Cargo.toml
      - name: Mocked reuse contracts and per-test timings
        run: >-
          uv run pytest tests/research_reuse -m research_reuse
          -rxX --durations=0 --junitxml=data/reuse-contracts.xml
      - name: Save contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reuse-contracts
          path: backend/data/reuse-contracts.xml
      - name: Show implemented and pending contracts
        if: always()
        run: uv run python scripts/summarize_reuse_contracts.py data/reuse-contracts.xml >> "$GITHUB_STEP_SUMMARY"


  swe-consumer:
    name: SWE consumer contracts
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned SWE source
        uses: actions/checkout@v5
        with:
          repository: kajmund/swe
          ref: ${{ env.SWE_TAG }}
          path: .swe-source
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned dependency
        run: uv sync --frozen
      - name: Build pinned swe_native
        run: uv run maturin develop --manifest-path ../.swe-source/crates/swe-native/Cargo.toml
      - name: Refuse a local engine copy
        run: |
          for forbidden in \
            ../python/swe \
            ../crates/swe-native \
            ../crates/swe-budget \
            ../crates/swe-reference \
            ../contracts \
            app/swe \
            app/swe_engine \
            app/services/swe
          do
            test ! -e "$forbidden"
          done
          resolved=$(uv run python -c 'import importlib.metadata, json; print(json.loads(importlib.metadata.distribution("swe-engine").read_text("direct_url.json"))["vcs_info"]["commit_id"])')
          test "$(git -C ../.swe-source rev-parse HEAD)" = "$resolved"
      - name: Dependency and backend consumer contracts
        run: >-
          uv run pytest
          tests/test_swe_dependency_contract.py
          tests/test_swe_provider.py
          tests/test_swe_persistence.py
          tests/test_research_swe/test_wiring.py
          tests/test_sufficiency_experiment_reuse.py
          -m swe_runtime

  postgres-schema:
    name: PostgreSQL schema
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: socialism_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
      OPENAI_API_KEY: test-openai-not-real
      CEREBRAS_API_KEY: test-cerebras-not-real
      SUPABASE_URL: https://test.supabase.co
      LOCAL_AUTH_JWT_SECRET: test-supabase-jwt-not-real
      SUPABASE_SERVICE_ROLE_KEY: test-supabase-service-role-not-real
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned SWE source
        uses: actions/checkout@v5
        with:
          repository: kajmund/swe
          ref: ${{ env.SWE_TAG }}
          path: .swe-source
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../.swe-source/crates/swe-native/Cargo.toml
      - name: Apply all Alembic migrations
        run: uv run alembic upgrade head
      - name: Verify shared chunk migration and concurrent ingestion
        env:
          TEST_SHARED_CHUNK_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
        run: uv run pytest tests/test_shared_chunk_postgres.py -m integration
      - name: Verify answer review migration and concurrent candidate workers
        env:
          TEST_ANSWER_REVIEW_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
        run: uv run pytest tests/test_answer_review_postgres.py -m integration
      - name: Verify LLM configuration table is protected
        run: |
          uv run python - <<'PYCODE'
          import psycopg
          from app.config import settings
          url = str(settings.database_url).replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(url) as connection:
              enabled = connection.execute(
                  "SELECT relrowsecurity FROM pg_class WHERE oid = 'public.llm_configurations'::regclass"
              ).fetchone()[0]
              assert enabled, "llm_configurations must deny direct client access through RLS"
          PYCODE

  frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run vitest
        run: pnpm test

  word-addin:
    name: Word add-in tests
    needs: changes
    if: needs.changes.outputs.word_addin == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: word-addin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: word-addin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck and test
        run: pnpm test && pnpm exec tsc -b --pretty false

  knowledge:
    name: Knowledge validate
    needs: changes
    if: needs.changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OKF manuals
        run: make knowledge-validate

  ci:
    name: CI
    if: always()
    needs: [changes, backend, research-reuse, swe-consumer, postgres-schema, frontend, word-addin, knowledge, swe-gym]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          changes="${{ needs.changes.result }}"
          backend="${{ needs.backend.result }}"
          research_reuse="${{ needs.research-reuse.result }}"
          swe_consumer="${{ needs.swe-consumer.result }}"
          postgres_schema="${{ needs.postgres-schema.result }}"
          frontend="${{ needs.frontend.result }}"
          word_addin="${{ needs.word-addin.result }}"
          knowledge="${{ needs.knowledge.result }}"
          swe_gym="${{ needs.swe-gym.result }}"

          if [ "$changes" != "success" ]; then
            echo "Change detection failed: changes=$changes"
            exit 1
          fi

          for result in "$backend" "$research_reuse" "$swe_consumer" "$postgres_schema" "$frontend" "$word_addin" "$knowledge" "$swe_gym"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required jobs: backend=$backend research-reuse=$research_reuse swe-consumer=$swe_consumer postgres-schema=$postgres_schema frontend=$frontend word-addin=$word_addin knowledge=$knowledge swe-gym=$swe_gym"
              exit 1
            fi
          done
