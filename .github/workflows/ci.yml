# Required check name for branch protection / rulesets: "CI"
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      word_addin: ${{ steps.filter.outputs.word_addin }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      swe_gym: ${{ steps.filter.outputs.swe_gym }}
      swe_core: ${{ steps.filter.outputs.swe_core }}
      contract_guard_present: ${{ steps.filter.outputs.contract_guard_present }}
      contract_guard_required: ${{ steps.filter.outputs.contract_guard_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select required test areas
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Fail closed: a swallowed diff error would otherwise report every
          # area false and let the aggregate job pass with nothing tested.
          set -euo pipefail
          backend=false
          frontend=false
          word_addin=false
          knowledge=false
          swe_gym=false
          swe_core=false
          contract_surface=false
          guard_script=false
          contract_guard_required=false
          base_rev="${BASE_SHA:-}"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            backend=true
            swe_core=true
            frontend=true
            word_addin=true
            knowledge=true
            swe_gym=true
          else
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "A pull_request event must provide base and head SHAs" >&2
              exit 1
            fi
            # Judge the PR against its merge base, not a base-branch tip that may
            # have moved since it branched. `--no-renames` keeps a move visible as
            # a deletion plus an addition.
            base_rev=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            if ! changed=$(git diff --name-only --no-renames "$base_rev" "$HEAD_SHA"); then
              echo "git diff failed for $base_rev..$HEAD_SHA; refusing to judge an unknown diff" >&2
              exit 1
            fi
            if [ -z "$changed" ]; then
              echo "The pull request changes no files; refusing to judge an empty diff" >&2
              exit 1
            fi
            while IFS= read -r path; do
              case "$path" in
                crates/swe-gym/*)
                  swe_gym=true
                  ;;
                contracts/*|crates/swe-native/src/journal.rs|crates/swe-native/src/definition.rs|crates/swe-native/src/needs.rs|crates/swe-native/src/evidence.rs|crates/swe-native/src/operations.rs|crates/swe-reference/src/journal.rs|python/swe/swd_v1.schema.json|python/swe/schema.py)
                  contract_surface=true
                  swe_core=true
                  backend=true
                  ;;
                scripts/check_contract_freeze.py)
                  guard_script=true
                  backend=true
                  ;;
                .github/workflows/*)
                  # The gate invocations live here, so a workflow change must
                  # execute the gates instead of trusting files on disk.
                  swe_core=true
                  backend=true
                  frontend=true
                  word_addin=true
                  knowledge=true
                  ;;
                crates/swe-native/*|crates/swe-budget/*|crates/swe-reference/*|contracts/*|mutations/*|scripts/check_mutations.py|Cargo.toml|Cargo.lock)
                  # swe-gym path-depends on swe-native and swe-budget, so a core
                  # change must build it too.
                  swe_core=true
                  backend=true
                  swe_gym=true
                  ;;
                backend/*|integrations/*|data/*|crates/*)
                  backend=true
                  ;;
                python/*)
                  # The SWE Python host package is exercised by the SWE runtime
                  # job (its tests) and the Python SWE package job (its wheel).
                  backend=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
                word-addin/*)
                  word_addin=true
                  ;;
                knowledge/*|okf.project.yaml|Makefile)
                  knowledge=true
                  ;;
                docs/*|features/*|inspiration/*|README.md|AGENTS.md)
                  # Reference material and project instructions do not affect a test target.
                  ;;
                *)
                  # New or shared areas are safety-sensitive until classified here.
                  backend=true
                  frontend=true
                  word_addin=true
                  knowledge=true
                  ;;
              esac
            done <<< "$changed"
          fi

          # A gate script may not disappear: the base revision had it and the
          # head does not. A gate's own matrix is a gate too. These checks run
          # before any output is written, so a deletion fails the changes job and
          # therefore the aggregate CI check.
          base_has=false
          head_has=false
          if [ -n "$base_rev" ] && git cat-file -e "$base_rev:scripts/check_contract_freeze.py" 2>/dev/null; then base_has=true; fi
          if [ -n "$HEAD_SHA" ] && git cat-file -e "$HEAD_SHA:scripts/check_contract_freeze.py" 2>/dev/null; then head_has=true; fi
          if [ "$base_has" = "true" ] && [ "$head_has" != "true" ]; then
            echo "The contract gate script existed at the base commit and is gone at the head" >&2
            exit 1
          fi
          # The mutation gate may not disappear either.
          mut_base=false
          mut_head=false
          if [ -n "$base_rev" ] && git cat-file -e "$base_rev:scripts/check_mutations.py" 2>/dev/null; then mut_base=true; fi
          if [ -n "$HEAD_SHA" ] && git cat-file -e "$HEAD_SHA:scripts/check_mutations.py" 2>/dev/null; then mut_head=true; fi
          if [ "$mut_base" = "true" ] && [ "$mut_head" != "true" ]; then
            echo "The mutation gate script existed at the base commit and is gone at the head" >&2
            exit 1
          fi
          # The gates' own matrices are gates too.
          for matrix_script in scripts/test_check_contract_freeze.py scripts/test_check_mutations.py; do
            matrix_base=false
            matrix_head=false
            if [ -n "$base_rev" ] && git cat-file -e "$base_rev:$matrix_script" 2>/dev/null; then matrix_base=true; fi
            if [ -n "$HEAD_SHA" ] && git cat-file -e "$HEAD_SHA:$matrix_script" 2>/dev/null; then matrix_head=true; fi
            if [ "$matrix_base" = "true" ] && [ "$matrix_head" != "true" ]; then
              echo "The gate matrix $matrix_script existed at the base commit and is gone at the head" >&2
              exit 1
            fi
          done
          if [ "$contract_surface" = "true" ] || [ "$guard_script" = "true" ]; then
            contract_guard_required=true
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "word_addin=$word_addin"
            echo "knowledge=$knowledge"
            echo "swe_gym=$swe_gym"
            echo "swe_core=$swe_core"
            echo "contract_guard_required=$contract_guard_required"
          } >> "$GITHUB_OUTPUT"

  swe-gym:
    name: Swe-gym tests
    needs: changes
    if: needs.changes.outputs.swe_gym == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/swe-gym
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/swe-gym
      - name: Format check
        run: cargo fmt --check
      - name: Tests
        run: cargo test

  backend:
    name: Backend tests (${{ matrix.group }}/4)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../crates/swe-native/Cargo.toml
      - name: Maintainability
        run: |
          uv run ruff check app tests scripts/check_maintainability.py ../python/swe ../python/tests
          uv run python scripts/check_maintainability.py
      - name: Run pytest
        run: >-
          uv run pytest
          -m "not smoke and not research_reuse and not swe_runtime"
          --splits 4
          --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  research-reuse:
    name: Research reuse contracts (steps 1–4)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../crates/swe-native/Cargo.toml
      - name: Mocked reuse contracts and per-test timings
        run: >-
          uv run pytest tests/research_reuse -m research_reuse
          -rxX --durations=0 --junitxml=data/reuse-contracts.xml
      - name: Save contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reuse-contracts
          path: backend/data/reuse-contracts.xml
      - name: Show implemented and pending contracts
        if: always()
        run: uv run python scripts/summarize_reuse_contracts.py data/reuse-contracts.xml >> "$GITHUB_STEP_SUMMARY"


  swe-runtime:
    name: SWE runtime
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contract_guard_required == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # merge-base/diff/show against the PR base need history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # B4: the extraction target is the workspace, so CI runs exactly the
      # commands the standalone project will run. `swe-gym` is deliberately not
      # a member and keeps its own job.
      - name: Workspace tests and lint
        working-directory: .
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Reference example walkthrough
        working-directory: .
        run: cargo run -p swe-reference
      # A contract change needs a declared reason: a version bump or a written
      # decision. The changes job marks the guard required from the checker's own
      # contract-path list, so a new contract file cannot be added without it.
      - name: Contract freeze guard
        if: github.event_name == 'pull_request' && needs.changes.outputs.contract_guard_required == 'true'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_contract_freeze.py --base "$BASE_SHA" --head "$HEAD_SHA"
      # A gate whose negative cases are not executed is a claim, not a mechanism.
      # Both matrices are cheap and static (throwaway repos / pure decisions), so
      # they must not depend on a selector that their own files could silence.
      - name: Gate self-test matrices
        working-directory: .
        run: |
          for matrix in scripts/test_check_contract_freeze.py scripts/test_check_mutations.py; do
            if [ ! -f "$matrix" ]; then
              echo "the gate matrix $matrix is missing" >&2
              exit 1
            fi
            python3 "$matrix"
          done
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../crates/swe-native/Cargo.toml
      - name: SWD and runtime tests (package consumed by the backend)
        run: uv run pytest ../python/tests -m "not smoke"
      # The backend keeps consumer tests that need the compiled extension. The
      # backend job deselects the swe_runtime marker, so these run here against the
      # same installed package and interpreter as the tests above. The wiring and
      # sufficiency-reuse files (18 tests) are a tracked pre-existing CI bypass:
      # one wiring test hangs/fails under the CI Python and needs its own
      # investigation before it can be a gate. See docs/swe-standalone/06 risk row.
      - name: Backend consumer tests (installed package)
        run: >-
          uv run pytest
          tests/test_swe_provider.py
          tests/test_swe_persistence.py
          -m swe_runtime

  python-swe:
    name: Python SWE package
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # The package proves itself in its own environment: its own lockfile, its
      # own venv, its own test tooling. Backend's venv is not involved.
      - name: Install, build and test the standalone package
        run: |
          set -euo pipefail
          cd python
          uv sync --locked --group dev
          cd ..
          uvx maturin build --manifest-path crates/swe-native/Cargo.toml --interpreter python/.venv/bin/python --out /tmp/wheels
          cd python
          # swe_native is a local wheel, not a PyPI dependency, so it is installed
          # after sync; --no-sync stops uv from pruning it again.
          uv pip install /tmp/wheels/*.whl
          uv run --no-sync pytest -m "not smoke"
      # The distribution, not just the source tree: a broken wheel (missing
      # metadata or package data such as swd_v1.schema.json) must fail CI.
      - name: Prove the distribution installs outside the repo
        run: |
          set -euo pipefail
          cd python
          uv build --out-dir /tmp/swe-dist
          ls /tmp/swe-dist/*.whl /tmp/swe-dist/*.tar.gz >/dev/null
          cd /tmp
          uv venv /tmp/swe-pkgvenv --python 3.12
          uv pip install --python /tmp/swe-pkgvenv/bin/python /tmp/swe-dist/*.whl
          # cwd is /tmp, so the import cannot fall back to the source checkout;
          # load_schema() opens the schema file from the installed package.
          /tmp/swe-pkgvenv/bin/python -c "import swe; swe.load_schema(); print('installed', swe.__file__)"

  swe-mutation:
    name: SWE mutation gate
    needs: changes
    if: needs.changes.outputs.swe_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # Blocking, but against a verified baseline: every mutation is classified
      # as detected / equivalent / excepted with a justification, and any
      # mutation whose outcome disagrees with its classification fails. See
      # mutations/baseline.json and docs/swe-standalone/14-mutation-gate.md.
      - name: Classified mutation gate
        run: |
          # A clean runner has no registry cache, so resolve the locked set
          # online first. The gate itself then runs offline: that is the property
          # the docs claim and CI verifies, not one it assumes.
          cargo fetch --locked
          python3 scripts/check_mutations.py --offline

  postgres-schema:
    name: PostgreSQL schema
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: socialism_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
      OPENAI_API_KEY: test-openai-not-real
      CEREBRAS_API_KEY: test-cerebras-not-real
      SUPABASE_URL: https://test.supabase.co
      LOCAL_AUTH_JWT_SECRET: test-supabase-jwt-not-real
      SUPABASE_SERVICE_ROLE_KEY: test-supabase-service-role-not-real
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
      - name: Build swe_native
        run: uv run maturin develop --manifest-path ../crates/swe-native/Cargo.toml
      - name: Apply all Alembic migrations
        run: uv run alembic upgrade head
      - name: Verify shared chunk migration and concurrent ingestion
        env:
          TEST_SHARED_CHUNK_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
        run: uv run pytest tests/test_shared_chunk_postgres.py -m integration
      - name: Verify answer review migration and concurrent candidate workers
        env:
          TEST_ANSWER_REVIEW_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
        run: uv run pytest tests/test_answer_review_postgres.py -m integration
      - name: Verify LLM configuration table is protected
        run: |
          uv run python - <<'PYCODE'
          import psycopg
          from app.config import settings
          url = str(settings.database_url).replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(url) as connection:
              enabled = connection.execute(
                  "SELECT relrowsecurity FROM pg_class WHERE oid = 'public.llm_configurations'::regclass"
              ).fetchone()[0]
              assert enabled, "llm_configurations must deny direct client access through RLS"
          PYCODE

  frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run vitest
        run: pnpm test

  word-addin:
    name: Word add-in tests
    needs: changes
    if: needs.changes.outputs.word_addin == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: word-addin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: word-addin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck and test
        run: pnpm test && pnpm exec tsc -b --pretty false

  knowledge:
    name: Knowledge validate
    needs: changes
    if: needs.changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OKF manuals
        run: make knowledge-validate

  ci:
    name: CI
    if: always()
    needs: [changes, backend, research-reuse, swe-runtime, python-swe, swe-mutation, postgres-schema, frontend, word-addin, knowledge, swe-gym]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          changes="${{ needs.changes.result }}"
          backend="${{ needs.backend.result }}"
          research_reuse="${{ needs.research-reuse.result }}"
          swe_runtime="${{ needs.swe-runtime.result }}"
          swe_mutation="${{ needs.swe-mutation.result }}"
          python_swe="${{ needs.python-swe.result }}"
          postgres_schema="${{ needs.postgres-schema.result }}"
          frontend="${{ needs.frontend.result }}"
          word_addin="${{ needs.word-addin.result }}"
          knowledge="${{ needs.knowledge.result }}"
          swe_gym="${{ needs.swe-gym.result }}"

          if [ "$changes" != "success" ]; then
            echo "Change detection failed: changes=$changes"
            exit 1
          fi

          # A selector that emits nothing is a broken selector, not "no areas".
          contract_guard_required="${{ needs.changes.outputs.contract_guard_required }}"
          swe_core="${{ needs.changes.outputs.swe_core }}"
          for flag in "$swe_core" "$contract_guard_required"; do
            case "$flag" in
              true|false) ;;
              *)
                echo "The changes job emitted an invalid selector value: '$flag'" >&2
                exit 1
                ;;
            esac
          done

          # The mutation gate must not be able to disappear silently. If core
          # files changed it has to run and pass; if they did not, it is allowed
          # to be skipped. Anything else is a broken selector or a skipped gate.
          if [ "$contract_guard_required" = "true" ] && [ "$swe_runtime" != "success" ]; then
            echo "The contract gate was required but SWE runtime was $swe_runtime"
            exit 1
          fi
          if [ "$swe_core" = "true" ] && [ "$swe_mutation" != "success" ]; then
            echo "Core files changed but the mutation gate was $swe_mutation"
            exit 1
          fi
          if [ "$swe_core" != "true" ] && [ "$swe_mutation" != "skipped" ] && [ "$swe_mutation" != "success" ]; then
            echo "The mutation gate failed without a core change: $swe_mutation"
            exit 1
          fi

          for result in "$backend" "$research_reuse" "$swe_runtime" "$python_swe" "$swe_mutation" "$postgres_schema" "$frontend" "$word_addin" "$knowledge" "$swe_gym"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required jobs: backend=$backend research-reuse=$research_reuse swe-runtime=$swe_runtime python-swe=$python_swe swe-mutation=$swe_mutation postgres-schema=$postgres_schema frontend=$frontend word-addin=$word_addin knowledge=$knowledge swe-gym=$swe_gym"
              exit 1
            fi
          done
