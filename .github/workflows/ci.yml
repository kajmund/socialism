# Required check name for branch protection / rulesets: "CI"
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      word_addin: ${{ steps.filter.outputs.word_addin }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select required test areas
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          backend=false
          frontend=false
          word_addin=false
          knowledge=false

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            backend=true
            frontend=true
            word_addin=true
            knowledge=true
          else
            while IFS= read -r path; do
              case "$path" in
                backend/*|integrations/*|data/*)
                  backend=true
                  ;;
                frontend/*)
                  frontend=true
                  ;;
                word-addin/*)
                  word_addin=true
                  ;;
                knowledge/*|okf.project.yaml|Makefile)
                  knowledge=true
                  ;;
                docs/*|features/*|inspiration/*|README.md|AGENTS.md)
                  # Reference material and project instructions do not affect a test target.
                  ;;
                *)
                  # New or shared areas are safety-sensitive until classified here.
                  backend=true
                  frontend=true
                  word_addin=true
                  knowledge=true
                  ;;
              esac
            done < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "word_addin=$word_addin"
            echo "knowledge=$knowledge"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests (${{ matrix.group }}/4)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pytest
        run: >-
          uv run pytest
          --splits 4
          --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  postgres-schema:
    name: PostgreSQL schema
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: socialism_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/socialism_test
      OPENAI_API_KEY: test-openai-not-real
      CEREBRAS_API_KEY: test-cerebras-not-real
      SUPABASE_URL: https://test.supabase.co
      LOCAL_AUTH_JWT_SECRET: test-supabase-jwt-not-real
      SUPABASE_SERVICE_ROLE_KEY: test-supabase-service-role-not-real
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply all Alembic migrations
        run: uv run alembic upgrade head

  frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run vitest
        run: pnpm test

  word-addin:
    name: Word add-in tests
    needs: changes
    if: needs.changes.outputs.word_addin == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: word-addin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: word-addin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck and test
        run: pnpm test && pnpm exec tsc -b --pretty false

  knowledge:
    name: Knowledge validate
    needs: changes
    if: needs.changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OKF manuals
        run: make knowledge-validate

  ci:
    name: CI
    if: always()
    needs: [changes, backend, postgres-schema, frontend, word-addin, knowledge]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          changes="${{ needs.changes.result }}"
          backend="${{ needs.backend.result }}"
          postgres_schema="${{ needs.postgres-schema.result }}"
          frontend="${{ needs.frontend.result }}"
          word_addin="${{ needs.word-addin.result }}"
          knowledge="${{ needs.knowledge.result }}"

          if [ "$changes" != "success" ]; then
            echo "Change detection failed: changes=$changes"
            exit 1
          fi

          for result in "$backend" "$postgres_schema" "$frontend" "$word_addin" "$knowledge"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required jobs: backend=$backend postgres-schema=$postgres_schema frontend=$frontend word-addin=$word_addin knowledge=$knowledge"
              exit 1
            fi
          done
