[project]
name = "overgraph-ingest"
version = "0.1.0"
description = "Standalone OverGraph document ingest and retrieval experiment."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.109.1",
    "overgraph==0.17.0",
    "pymupdf==1.26.5",
    "python-docx==1.2.0",
]

[project.scripts]
overgraph-ingest = "overgraph_ingest.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overgraph_ingest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
