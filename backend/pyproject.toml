[project]
name = "opinionssimulator-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    # AWS SigV4 + S3 protocol for Supabase Storage; not something we write in <30 lines.
    "boto3==1.43.85",
    # Official cancellable streaming TTS client; used for every Live Speech reply.
    "elevenlabs==2.26.0",
    "fastapi>=0.140.7",
    "greenlet==3.5.4",
    "httpx>=0.28.1",
    # Full JSON Schema validation (additionalProperties, enum, numeric and array bounds).
    "jsonschema>=4.26.0",
    # PDF text extraction for personal underlag; not something we write correctly in <30 lines.
    "mammoth==1.11.0",
    # LLM extraction, dedupe, multimodal parsing, and retrieval for expert memory.
    "mem0ai==2.0.20",
    "openai==2.48.0",
    # Embedded graph + hybrid vector engine; not something we write in <30 lines.
    "overgraph==0.17.0",
    "pdfplumber==0.11.9",
    # Decode, validate and strip image metadata; robust codecs are not a small helper.
    "pillow>=10.4.0",
    # PostgreSQL driver for the long-running backend process and Alembic.
    "psycopg[binary]>=3.2.0",
    # Mem0's pgvector provider uses Psycopg's maintained connection pool.
    "psycopg-pool>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    # Official async transport for Supabase Storage Vector Buckets (alpha API).
    "storage3==2.31.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
    # Async Realtime wire protocol and close/error semantics; used by every STT session.
    "websockets==15.0.1",
]

[project.optional-dependencies]
# Live körningar spike. Install: uv sync --extra oasis
# Justification: multi-agent social env + action space + recsys we would not
# reimplement in <30 lines; used only when SIMULATION_ENGINE=oasis.
oasis = [
    "camel-oasis",
    # Search tools (CAMEL SearchToolkit's duckduckgo-search dep is frozen stub).
    "ddgs>=9.0.0",
    "wikipedia>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
# camel-oasis pins older transitive deps that lack py3.13 wheels; keep ours.
override-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "openai>=1.86.0",
    "tiktoken>=0.9.0",
    "pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-split==0.11.0",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "research_reuse: isolated four-step Graph v2 reuse contracts (all external boundaries mocked)",
    "integration: hits network or optional heavy deps (skipped in default CI)",
    "smoke: manual live OASIS simulation against camel-oasis + DeepSeek (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR1702",
    "BLE001",
    "PGH004",
    "RUF100",
]
ignore = [
    "B008",  # FastAPI Depends() / Query() in defaults is idiomatic
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 4
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 5

[tool.socialism.maintainability]
app-max-lines = 500
tests-max-lines = 1000

