[project]
name = "opinionssimulator-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "fastapi>=0.140.7",
    "greenlet==3.5.4",
    "httpx>=0.28.1",
    "openai==2.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
# Live körningar spike. Install: uv sync --extra oasis
# Justification: multi-agent social env + action space + recsys we would not
# reimplement in <30 lines; used only when SIMULATION_ENGINE=oasis.
oasis = [
    "camel-oasis",
    # Search tools (CAMEL SearchToolkit's duckduckgo-search dep is frozen stub).
    "ddgs>=9.0.0",
    "wikipedia>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
# camel-oasis pins older transitive deps that lack py3.13 wheels; keep ours.
override-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "openai>=1.86.0",
    "tiktoken>=0.9.0",
    "pillow>=10.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "integration: hits network or optional heavy deps (skipped in default CI)",
    "smoke: manual live OASIS simulation against camel-oasis + DeepSeek (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends() / Query() in defaults is idiomatic
]
