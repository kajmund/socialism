[package]
name = "swe-gym"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Sweycoin budget gym: ledger, metered driver, PoC demo"
license = "UNLICENSED"
publish = false

[dependencies]
swe-native = { git = "https://github.com/kajmund/swe", rev = "dbb20d4fd4c9fe00e68c4d88489e9fa3ae3f2a1e" }
swe-budget = { git = "https://github.com/kajmund/swe", rev = "dbb20d4fd4c9fe00e68c4d88489e9fa3ae3f2a1e" }
# Small sync HTTP client; ureq's dependency tree (url → idna → icu) needs
# edition 2024 on current releases, which the repo's Rust 1.83 cannot parse.
minreq = { version = "2", features = ["https-rustls"] }
